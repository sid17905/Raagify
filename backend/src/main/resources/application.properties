spring.application.name=raagify
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/raagify?createDatabaseIfNotExist=false&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:raagify}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=36MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d
app.storage.audio-path=${AUDIO_STORAGE_PATH:./data/audio}
app.storage.cover-path=${COVER_STORAGE_PATH:./data/covers}
app.storage.audio-max-bytes=${AUDIO_MAX_BYTES:26214400}
app.storage.cover-max-bytes=${COVER_MAX_BYTES:5242880}
app.ml.base-url=${ML_BASE_URL:http://127.0.0.1:8000}
app.ml.connect-timeout-ms=${ML_CONNECT_TIMEOUT_MS:750}
app.ml.read-timeout-ms=${ML_READ_TIMEOUT_MS:15000}
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
app.bootstrap.admin-name=${ADMIN_NAME:Raagify Admin}
management.endpoints.enabled-by-default=false
